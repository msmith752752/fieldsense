workflows:
  ios-workflow:
    name: FieldSense iOS
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fieldsense.app
    scripts:
      - name: Get Flutter packages
        script: |
          cd frontend/fieldsense_app
          flutter packages pub get
      - name: Build iOS
        script: |
          cd frontend/fieldsense_app
          flutter build ipa --release
    artifacts:
      - frontend/fieldsense_app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: Codemagic
        submit_to_testflight: true
