workflows:
  ios-workflow:
    name: FieldSense iOS
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fieldsense.app
        certificate: fieldsense_distribution
        provisioning_profile: fieldsense_app_store
    scripts:
      - name: Get Flutter packages
        script: |
          cd frontend/fieldsense_app
          flutter packages pub get
      - name: Build iOS
        script: |
          cd frontend/fieldsense_app
          flutter build ipa --release
    artifacts:
      - frontend/fieldsense_app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 8628CY33P9
        issuer_id: 124be977-f88e-483a-a7d4-28938605a965
        submit_to_testflight: true
